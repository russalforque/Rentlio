<!-- Supabase Auth > Email Templates > Reset password. Subject: Reset your password -->
<div style="font-family:Manrope,Segoe UI,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#1f2430">
  <h2 style="margin:0 0 12px;font-size:20px">Reset your password</h2>
  <p style="margin:0 0 20px;line-height:1.6;color:#4a5160">Someone asked to reset the password for this account. If it was you, choose a new password below.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
       style="display:inline-block;background:#1f7a5c;color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:8px">
      Choose a new password
    </a>
  </p>
  <p style="margin:0;font-size:13px;color:#7a8190">If you did not ask for this, you can ignore this email. Your password will not change.</p>
</div>
